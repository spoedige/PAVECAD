<title>Mapa de Soluções de Restauração</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mapa em tela cheia, controles e painéis de vidro flutuando por cima. Claro primeiro, escuro por tokens, modo campo de alto contraste para uso ao sol. */
:root{
  --bg:#f5f5f7; --glass:rgba(255,255,255,.78); --solid:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --faint:#aeaeb2;
  --hair:rgba(0,0,0,.09); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.22);
  --accent:#007aff; --accent-ink:#ffffff; --map:#eceef2; --none:#d1d1d6; --focus:#007aff; --drain:#e0267f;
  --shadow:0 12px 40px rgba(0,0,0,.13),0 2px 6px rgba(0,0,0,.05); --thumb:#ffffff; --thumb-ink:#1d1d1f; --thumb-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.06);
  --bw:.5px; --blur:blur(26px) saturate(180%); --fs:13px; --tap:30px;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --g:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --uni-h:190px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-contrast]){
  --bg:#000000; --glass:rgba(30,30,33,.76); --solid:#1c1c1e; --fg:#f5f5f7; --muted:#a1a1a6; --faint:#636366;
  --hair:rgba(255,255,255,.13); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.38);
  --accent:#0a84ff; --map:#17181b; --none:#3a3a3c; --focus:#64b5ff; --drain:#ff5fa8;
  --shadow:0 12px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3); --thumb:#636366; --thumb-ink:#f5f5f7; --thumb-shadow:0 1px 3px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]:not([data-contrast]){
  --bg:#000000; --glass:rgba(30,30,33,.76); --solid:#1c1c1e; --fg:#f5f5f7; --muted:#a1a1a6; --faint:#636366;
  --hair:rgba(255,255,255,.13); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.38);
  --accent:#0a84ff; --map:#17181b; --none:#3a3a3c; --focus:#64b5ff; --drain:#ff5fa8;
  --shadow:0 12px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3); --thumb:#636366; --thumb-ink:#f5f5f7; --thumb-shadow:0 1px 3px rgba(0,0,0,.45); color-scheme:dark;}
/* modo campo: contraste máximo, sem transparência, alvos de toque maiores */
:root[data-contrast="field"]{
  --bg:#ffffff; --glass:#ffffff; --solid:#ffffff; --fg:#000000; --muted:#262626; --faint:#4a4a4a;
  --hair:#000000; --fill:#ececec; --fill2:#c9c9c9; --accent:#0033b3; --accent-ink:#ffffff; --map:#ffffff; --none:#bdbdbd; --focus:#000000; --drain:#b00058;
  --shadow:0 3px 0 rgba(0,0,0,.28); --thumb:#000000; --thumb-ink:#ffffff; --thumb-shadow:none;
  --bw:1.5px; --blur:none; --fs:15px; --tap:44px; color-scheme:light;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{position:relative;height:100%}
.stage{position:absolute;inset:0;background:var(--map)}
#map{position:absolute;inset:0}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:var(--bw) solid var(--hair);box-shadow:var(--shadow);border-radius:16px}

.topbar{position:absolute;left:var(--g);right:var(--gr);top:12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.topbar>*{pointer-events:auto}
.title{padding:9px 14px;min-width:0;max-width:300px}
.title b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{display:flex;gap:8px;align-items:center}
.pillbtn{display:inline-flex;align-items:center;gap:7px;height:max(36px,var(--tap));padding:0 14px;border-radius:999px;border:var(--bw) solid var(--hair);background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);font-weight:500}
.pillbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.seg{position:relative;display:inline-flex;padding:2px;border-radius:10px;background:var(--fill);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg::before{content:'';position:absolute;top:2px;bottom:2px;left:0;width:var(--w,0px);transform:translateX(var(--x,0px));border-radius:8px;background:var(--thumb);box-shadow:var(--thumb-shadow);transition:transform .22s cubic-bezier(.3,.9,.3,1),width .22s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:6px 12px;min-height:var(--tap);border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;transition:color .15s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:var(--thumb-ink);font-weight:600}
.seg.glass{background:var(--glass);border-radius:14px}
.modes{padding:3px}
.modes::before{top:3px;bottom:3px;border-radius:9px}
.modes button{border-radius:9px}

.toolbar{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px;border-radius:14px}
.tbtn{width:max(34px,var(--tap));height:max(34px,var(--tap));border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--fg);position:relative}
.tbtn:hover{background:var(--fill)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tsep{width:1px;background:var(--hair);margin:5px 3px}
.tbtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#34c759;display:none}
.tbtn.live .dot{display:block}

.leftcol{position:absolute;left:var(--g);top:66px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;z-index:4;max-width:calc(50% - 150px)}
.search{display:flex;align-items:center;gap:8px;height:max(36px,var(--tap));padding:0 6px 0 12px;border-radius:999px;width:200px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;height:100%}
.search input::placeholder{color:var(--faint)}
.search:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--accent)}
.search .go{width:26px;height:26px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.rotbar{display:flex;align-items:center;gap:2px;padding:3px;border-radius:14px}
.views{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{height:max(28px,var(--tap));padding:0 11px;border-radius:999px;border:var(--bw) solid var(--hair);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--fg);font-size:12px;font-weight:500;white-space:nowrap}
.chipbtn:hover{background:var(--solid)}
#zoomhost{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#zoomhost .maplibregl-ctrl{float:none;margin:0}
.maplibregl-ctrl-group{background:var(--glass)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:var(--bw) solid var(--hair);border-radius:12px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{width:max(34px,var(--tap))!important;height:max(34px,var(--tap))!important;background:transparent!important}
.maplibregl-ctrl-group button+button{border-top:var(--bw) solid var(--hair)!important}
:root[data-theme="dark"]:not([data-contrast]) .maplibregl-ctrl-icon{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-contrast]) .maplibregl-ctrl-icon{filter:invert(1)}}
.maplibregl-ctrl-scale{background:transparent!important;border-color:var(--muted)!important;color:var(--muted)!important;font-size:10px!important;padding:0 4px!important;border-width:0 1.5px 1.5px!important}
.maplibregl-ctrl-attrib{background:var(--glass)!important;color:var(--muted)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.zoomnote{margin:0;font-size:11px;color:var(--muted);max-width:190px;line-height:1.35;padding:2px 2px 0}

.legend{position:absolute;left:var(--g);bottom:calc(var(--uni-h) + 24px);z-index:4;padding:6px 8px;max-width:min(360px,calc(100% - 440px))}
.legend h4{margin:0;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.leghead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 2px}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 2px}
.legend li button{display:flex;align-items:center;gap:5px;border:0;background:transparent;padding:2px 6px;border-radius:7px;font-size:11.5px;min-height:max(24px,calc(var(--tap) - 14px));transition:opacity .15s,background .15s;white-space:nowrap}
.legend li button:hover{background:var(--fill)}
.legend li button[aria-pressed="false"]{opacity:.38}
.sw{width:8px;height:8px;border-radius:50%;flex:none}
.legtog{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:2px 4px;border-radius:8px;min-height:max(26px,calc(var(--tap) - 12px))}
.legtog.sm{padding:0;width:24px;justify-content:center}
.legtog svg{width:14px;height:14px}
.legtog .dots{display:inline-flex;gap:3px}
.legtog .dots i{width:9px;height:9px;border-radius:50%;display:block}
.focusbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:5px 6px 5px 10px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:500}
.focusbar span{flex:1;min-width:0}
.focusbar button{border:0;background:rgba(255,255,255,.25);color:inherit;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0}
.toast{position:absolute;left:50%;bottom:calc(var(--uni-h) + 28px);transform:translate(-50%,8px);z-index:8;padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:absolute;z-index:6;pointer-events:none;padding:6px 10px;border-radius:10px;font-size:12px;white-space:nowrap;display:none;line-height:1.35}
.tip span{color:var(--muted)}
.propbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--uni-h) + 28px);z-index:7;padding:12px;border-radius:16px;width:min(540px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.propbar[hidden]{display:none}
.pb-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pb-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb-row select{flex:1;min-width:0;border:0;border-radius:10px;background:var(--fill);padding:7px 10px;min-height:max(34px,var(--tap));color:var(--fg);font-weight:500}
.pb-in{flex:1;min-width:120px;border:0;border-radius:10px;background:var(--fill);padding:8px 12px;min-height:max(34px,var(--tap));outline:none}
.pb-in:focus{box-shadow:0 0 0 2px var(--accent)}
.pb-row .btn{flex:none}
.drawbar,.gpschip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--uni-h) + 28px);z-index:7;padding:8px 10px 8px 14px;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:12.5px;max-width:92%}
.gpschip{bottom:auto;top:110px;border-radius:14px}
.drawbar[hidden],.gpschip[hidden]{display:none}
.drawbar button,.gpschip button{border:0;border-radius:999px;padding:5px 11px;background:var(--fill);font-weight:500;min-height:var(--tap)}
.drawbar button.p,.gpschip button.p{background:var(--accent);color:var(--accent-ink)}

.kmlabel{font-size:10px;font-weight:600;color:var(--muted);background:var(--glass);border:var(--bw) solid var(--hair);border-radius:999px;padding:1px 7px;white-space:nowrap;pointer-events:none}
.kmlabel.k1{display:none}
.stake{font-size:10.5px;font-weight:600;color:var(--fg);background:var(--solid);border:var(--bw) solid var(--hair);border-radius:5px;padding:0 5px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.stake.km{font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:transparent}
:root[data-contrast="field"] .stake{font-size:12.5px}
.zoom-hi .kmlabel.k1{display:block}
.poi{font-size:10px;font-weight:700;color:#fff;background:#5e5ce6;border:1.5px solid #fff;border-radius:6px;padding:1px 6px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.poi.ped{background:#ff375f}
:root[data-contrast="field"] .kmlabel{font-size:12px;color:#000}
.hide-km .kmlabel,.hide-poi .poi{display:none!important}
.stage:not(.zoom-hi) .poi,.stage:not(.zoom-hi) .kmlabel{display:none}

.inspector{position:absolute;right:var(--gr);top:60px;bottom:calc(var(--uni-h) + 24px);width:380px;z-index:5;display:flex;flex-direction:column;min-height:0}
.inspector.collapsed{bottom:auto}
.inspector.collapsed .tabbody,.inspector.collapsed .foot{display:none}
.ihead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px}
.ihead .seg{flex:1}
.ihead .seg button{flex:1;padding:6px 3px;font-size:12px}
.iconbtn{width:max(30px,var(--tap));height:max(30px,var(--tap));border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.iconbtn:hover{background:var(--fill2);color:var(--fg)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.tabbody{padding:6px 14px 14px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.tabbody>*{flex:none}
.tabbody[hidden]{display:none}
.foot{padding:8px 14px 10px;border-top:var(--bw) solid var(--hair);color:var(--faint);font-size:11px;display:flex;flex-wrap:wrap;gap:4px 12px}
kbd{font:500 10.5px var(--sans);background:var(--fill);border-radius:5px;padding:1px 5px;color:var(--muted)}
.sect{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 7px;letter-spacing:.02em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}
.lead{color:var(--muted);margin:3px 0 0}
.list{background:var(--fill);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:max(40px,var(--tap));width:100%;border:0;background:transparent;text-align:left}
.row+.row{border-top:var(--bw) solid var(--hair)}
button.row:hover{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .val{font-weight:600}
.bar{height:3px;border-radius:2px;margin-top:6px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--fill);padding:4px 10px;font-size:12px;font-weight:500}
.empty{color:var(--muted);padding:28px 8px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.btn{border:0;border-radius:10px;background:var(--fill);padding:7px 12px;font-weight:500;min-height:max(34px,var(--tap));display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--fill2)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.d{color:#ff3b30}
.btn[disabled]{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.shead{display:flex;align-items:flex-start;gap:8px}
.shead>div:first-child{flex:1;min-width:0}
.sbtns{display:flex;gap:6px}
.params{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.param{background:var(--fill);border-radius:12px;padding:10px 12px}
.param .k{font-size:11px;color:var(--muted);font-weight:500}
.param .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:1px;line-height:1.2}
.param .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.scale{display:flex;gap:2px;margin-top:7px}
.scale i{flex:1;height:3px;border-radius:2px;background:var(--fill2)}
.xs{display:flex;height:34px;gap:2px}
.xs div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);min-width:0;overflow:hidden;white-space:nowrap;border-radius:7px}
.xs div.sel{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--accent)}
.xs div.nodata{color:var(--muted);text-shadow:none}
.xsticks{position:relative;height:16px;margin-top:4px;font-size:10.5px;color:var(--muted)}
.xsticks span{position:absolute;top:0;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--fill2);color:var(--muted);vertical-align:middle}

.prow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;min-height:max(46px,var(--tap))}
.prow+.prow{border-top:var(--bw) solid var(--hair)}
.prow .nm{flex:1;min-width:0;background:transparent;border:0;text-align:left;padding:0}
.prow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{display:block;font-size:11px;color:var(--muted)}
.dirb{font-size:10px;font-weight:700;border-radius:5px;padding:2px 5px;background:var(--accent);color:var(--accent-ink);flex:none}
.dirb.d{background:#ff9500;color:#000}
.dirb.m{background:#8e8e93;color:#fff}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;min-height:max(42px,var(--tap))}
.field+.field{border-top:var(--bw) solid var(--hair)}
.field label{flex:none}
.field select,.field input[type=number]{border:0;background:transparent;color:var(--accent);font-weight:500;text-align:right;text-align-last:right;max-width:58%;padding:4px 2px;border-radius:6px}
.field input[type=number]{width:80px}
.sw2{position:relative;width:46px;height:28px;border-radius:999px;background:var(--fill2);border:0;flex:none;transition:background .2s}
.sw2::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw2[aria-checked="true"]{background:#34c759}
:root[data-contrast="field"] .sw2[aria-checked="true"]{background:#007a33}
.sw2[aria-checked="true"]::after{transform:translateX(18px)}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
details{background:var(--fill);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--muted);font-size:16px;line-height:1}
details[open] summary::after{content:'−'}
.formula{font:12px/1.7 var(--mono);margin:8px 0 0;overflow-x:auto;white-space:pre}

.matrix{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:12px}
.matrix th{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 2px 3px}
.matrix th:first-child{text-align:left}
.matrix td{padding:0}
.matrix td.nm{padding-right:6px;white-space:nowrap}
.matrix td.mean{padding-left:6px;text-align:right;color:var(--muted);white-space:nowrap}
.cell{display:block;width:100%;border:0;border-radius:6px;padding:7px 0;text-align:center;font-weight:600;background:var(--fill);position:relative;font-variant-numeric:tabular-nums;font-size:11.5px}
.cell:hover{outline:2px solid var(--accent)}
.cell i{position:absolute;inset:0;border-radius:6px;opacity:.9}
.cell b{position:relative;font-weight:600}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:1px;background:var(--fill)}
.stack button{border:0;padding:0;min-width:3px;position:relative}
.stack button:hover{filter:brightness(1.12);outline:2px solid var(--fg);outline-offset:-2px}
.stackrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.rule{display:flex;align-items:center;gap:10px;padding:9px 12px}
.rule+.rule{border-top:var(--bw) solid var(--hair)}
.rule .t{flex:1;min-width:0}
.rule .t small{display:block;color:var(--muted);font-size:11px}
.rule .n{font-weight:700;font-size:15px}
.rule.ok .n{color:#34c759}
.rule.bad .n{color:#ff9500}

.note-card{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.note-card+.note-card{border-top:var(--bw) solid var(--hair)}
.note-top{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:0}
.note-top .t{flex:1;min-width:0}
.note-top .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-top .t span{font-size:11px;color:var(--muted)}
textarea{width:100%;min-height:78px;resize:vertical;border:0;border-radius:10px;background:var(--solid);padding:9px 10px;outline:none;box-shadow:inset 0 0 0 var(--bw) var(--hair)}
textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.photos{display:flex;gap:6px;flex-wrap:wrap}
.photos div{position:relative;width:62px;height:62px;border-radius:8px;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}

.uni{position:absolute;left:var(--g);right:var(--gr);bottom:12px;height:var(--uni-h);z-index:5;padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.uni-h{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;min-height:22px}
.uni-h b{font-weight:600}
.uni-h .sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.uni-h .chipbtn{height:24px;font-size:11px;padding:0 9px;min-height:0}
.uni-wrap{position:relative;flex:none;cursor:crosshair}
#uni{position:absolute;inset:0;width:100%;height:100%;display:block}
#unihover{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--muted);display:none;pointer-events:none}
#unihover span{position:absolute;top:-2px;left:6px;transform:translateY(-100%);background:var(--solid);border:var(--bw) solid var(--hair);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow)}
.uni.collapsed .uni-wrap{display:none}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
  .stage{position:relative;inset:auto;height:72vh;min-height:460px}
  .topbar{top:10px;flex-wrap:wrap;align-items:stretch}
  .title{max-width:none;flex:1}
  .topright{order:2}
  .modes{order:3;width:100%}
  .modes button{flex:1;padding:6px 4px}
  .toolbar{top:auto;bottom:12px;left:auto;right:12px;transform:none}
  .leftcol{top:128px;max-width:calc(100% - 24px)}
  .zoomnote,#zoomhost{display:none}
  .legend{position:relative;left:auto;bottom:auto;margin:0 var(--gr) 0 var(--g);max-width:none;z-index:1}
  .inspector{position:relative;right:auto;top:auto;bottom:auto;width:auto;margin:0 var(--gr) 0 var(--g)}
  .inspector .tabbody{overflow:visible}
  .uni{position:relative;left:auto;right:auto;bottom:auto;margin:0 var(--gr) 0 var(--g)}
  .toast,.propbar{bottom:80px}
  .gpschip{top:176px}
  .search{width:170px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
const EMBED = __EMBED__;

/* ================================================================== */
/* Constantes                                                          */
/* ================================================================== */
const TR = {
  FS3:{c:'#5ac8fa',f:'#1f6fd0',l:'Fresagem funcional 3 cm'},
  FS4:{c:'#0a84ff',f:'#0033b3',l:'Fresagem funcional 4 cm'},
  FSE:{c:'#af52de',f:'#7b2fbe',l:'Fresagem estrutural'},
  MFS:{c:'#30b0c7',f:'#00788f',l:'Microfresagem'},
  RP: {c:'#ff3b30',f:'#d0021b',l:'Reparo profundo'},
  REC:{c:'#a2231d',f:'#6b0f0a',l:'Reconstrução'},
  Micro:{c:'#ffcc00',f:'#e6a800',l:'Microrrevestimento'},
  GAP:{c:'#ff9500',f:'#ff6a00',l:'Gap graded'}
};
const TR_ORDER = ['FS3','FS4','FSE','MFS','RP','REC','Micro','GAP'];
const TREAT_LABELS = ['Estrutural','Fresagem funcional','Fresagem estrutural','Selagem','Microfresagem','Fresagem fina','Revestimento'];
const Q5 = ['#34c759','#a4d64a','#ffcc00','#ff9500','#ff3b30'];
const Q5F = ['#007a33','#6aa000','#f2c200','#ff6a00','#d0021b'];
const MODES = {
  iri:{label:'IRI',unit:'m/km',i:1,dec:2,prop:'c_iri',cls:v=>v<=1.5?0:v<=2?1:v<=2.7?2:v<=3.5?3:4,labels:['≤ 1,5','1,5 a 2,0','2,0 a 2,7','2,7 a 3,5','> 3,5'],lim:'admissível 2,7'},
  atr:{label:'ATR máx',unit:'mm',i:3,dec:1,prop:'c_atr',cls:v=>v<=3?0:v<=5?1:v<=8?2:v<=12?3:4,labels:['≤ 3','3 a 5','5 a 8','8 a 12','> 12']},
  d0: {label:'D0',unit:'0,01 mm',i:4,dec:1,prop:'c_d0',cls:v=>v<=20?0:v<=30?1:v<=40?2:v<=50?3:4,labels:['≤ 20','20 a 30','30 a 40','40 a 50','> 50']},
  rc: {label:'Rc',unit:'m',i:5,dec:0,prop:'c_rc',cls:v=>v>=500?0:v>=300?1:v>=200?2:v>=150?3:4,labels:['≥ 500','300 a 500','200 a 300','150 a 200','< 150'],low:true},
  def:{label:'% Defeitos',unit:'%',i:2,dec:1,prop:'c_def',scale:100,cls:v=>v===0?0:v<=.05?1:v<=.15?2:v<=.30?3:4,labels:['0%','até 5%','5 a 15%','15 a 30%','> 30%']}
};
const MODE_KEYS = ['sol','iri','atr','d0','rc','def'];
const NOTE_CATS = {obs:{l:'Observação',c:'#5e5ce6'},def:{l:'Defeito',c:'#ff2d55'},dre:{l:'Dreno',c:'#00a99d'},rev:{l:'Revisar solução',c:'#ff9f0a'}};
const M_LAT = 111132, LINE_WIN = 5;

/* ================================================================== */
/* Estado                                                              */
/* ================================================================== */
let P = [], pidN = 0;
let mode = 'sol', sel = null, focus = null, dim = new Set();
let field = false, baseSel = 'none';
let layers = {drain:true, poi:true, km:true, notes:true};
let tool = null, draft = [], editing = null, notes = [];
let gps = {on:false, follow:true, id:null, last:null, lock:null};
let activeGroup = null, settingsPid = null, anInd = 'iri', uniCollapsed = false;
let map, mapReady = false;
const $ = s => document.querySelector(s);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v,d=1) => v==null||isNaN(v) ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const kmLabel = km => { const k=Math.floor(km+1e-9); return k+'+'+String(Math.round((km-k)*1000)).padStart(3,'0'); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q = () => field ? Q5F : Q5;
const trc = k => k==='-'||!k ? cssv('--none') : (TR[k] ? (field?TR[k].f:TR[k].c) : '#8e8e93');
const trl = k => k==='-' ? 'Sem intervenção' : (TR[k]?TR[k].l:k);
const drainColor = () => cssv('--drain');
const IC = {
  prev:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',
  up:'<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  cam:'<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>'
};
let toastT;
function toast(msg,ms=3400){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms); }
function syncSeg(el){
  if(!el) return;
  const b = el.querySelector('[aria-pressed="true"],[aria-selected="true"]'); if(!b) return;
  el.style.setProperty('--x', b.offsetLeft+'px'); el.style.setProperty('--w', b.offsetWidth+'px');
}
const syncAllSegs = () => document.querySelectorAll('.seg').forEach(syncSeg);
addEventListener('resize',syncAllSegs);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncAllSegs);
const visibleProjects = () => P.filter(p=>p.visible);
const getP = id => P.find(p=>p.id===id);
const short = p => /Marginal/i.test(p.meta.via) ? p.meta.via.replace(/\s*-\s*Crescente|\s*-\s*Decrescente/,'') : p.meta.via;
const ufShort = p => (p.meta.uf.split('/')[1]||p.meta.uf);
const projName = p => `${ufShort(p)} ${short(p)}`;

/* ================================================================== */
/* Modelo                                                              */
/* ================================================================== */
function parseCode(code){
  if(!code) return {main:'-',comp:null,pct:100,code:null};
  const t = code.split('+'), m = /^[A-Za-z0-9]+/.exec(t[0]), p = /\((\d+)%\)/.exec(t[0]);
  return {main:m?m[0]:'-',comp:t[1]||null,pct:p?+p[1]:100,code};
}
function createProject(d,label){
  const m = d.meta, p = {id:'p'+(++pidN),meta:m,rows:d.rows,label:label||m.name,visible:true,
    opts:{travel:m.travel,dir:1,origin:'edge',win:2,shoulder:true,extra:/marginal/i.test(m.name)?12:0,extraSide:1,drainSide:'out'}};
  const R = p.rows; p.segs = []; let a = 0;
  for(let i=1;i<=R.length;i++) if(i===R.length || R[i][0]-R[i-1][0] > 0.0215){ p.segs.push({a,b:i-1}); a=i; }
  p.segOf = new Int32Array(R.length); p.segs.forEach((s,si)=>{ for(let i=s.a;i<=s.b;i++) p.segOf[i]=si; });
  p.model = R.map(r=>({tr:r[8].map(l=>parseCode(l[0])),sh:parseCode(r[5]),w:r[3],ac:r[4]}));
  p.maxLanes = 1; for(const m2 of p.model) if(m2.w.length>p.maxLanes) p.maxLanes=m2.w.length;
  p.lnum = R.map(r=>{ const mm=/^(\d+)\+(\d+)$/.exec(r[9]||''); return mm?+mm[1]+ +mm[2]/1000:r[0]; });
  p.lab = p.lnum.map(v=>kmLabel(v));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const r of R){ x0=Math.min(x0,r[2]);x1=Math.max(x1,r[2]);y0=Math.min(y0,r[1]);y1=Math.max(y1,r[1]); }
  p.bounds = [[x0,y0],[x1,y1]]; p.polyByFid = new Map(); p.markers = []; p.nrm = [];
  return p;
}
const winStart = (p,i) => { const s=p.segs[p.segOf[i]]; return s.a+Math.floor((i-s.a)/LINE_WIN)*LINE_WIN; };

/* ================================================================== */
/* Geometria                                                           */
/* ================================================================== */
function edgesOf(p,i){
  const o=p.opts, md=p.model[i], w1=md.w[0]||3.6;
  const s0 = (o.origin==='axis' ? -o.dir*w1/2 : 0) + o.extraSide*o.extra;
  const e=[s0]; let c=s0; for(const w of md.w){ c += o.dir*w; e.push(c); }
  const hasSh = o.shoulder && md.ac>0; if(hasSh) e.push(c+o.dir*md.ac);
  return {e,N:md.w.length,hasSh};
}
const ptAt = (p,i,e) => { const r=p.rows[i], n=p.nrm[i]; return [+(r[2]+e*n.e/n.mLon).toFixed(7), +(r[1]+e*n.n/M_LAT).toFixed(7)]; };
function drainEdge(p,i){ const e=edgesOf(p,i).e; return p.opts.drainSide==='in' ? Math.min(...e)-0.45 : Math.max(...e)+0.45; }
function classProps(L){ const o={}; for(const k of ['iri','atr','d0','rc','def']){ const M=MODES[k], v=L[M.i]; o[M.prop]=v==null?-1:M.cls(v); } return o; }
function buildProject(p){
  const R=p.rows, o=p.opts, W=o.win, sgn=o.travel;
  p.nrm = new Array(R.length).fill(null);
  for(const sg of p.segs) for(let k=sg.a;k<=sg.b;k++){
    const ka=Math.max(sg.a,k-W), kb=Math.min(sg.b,k+W); if(ka===kb) continue;
    const mLon=111320*Math.cos(R[k][1]*Math.PI/180);
    const th=Math.atan2((R[kb][2]-R[ka][2])*mLon,(R[kb][1]-R[ka][1])*M_LAT);
    p.nrm[k]={e:Math.cos(th)*sgn,n:-Math.sin(th)*sgn,mLon};
  }
  const polys=[],lines=[],drains=[]; p.polyByFid=new Map();

function colorExpr(){

    const m=['match',['get','main']]; for(const k of Object.keys(TR)) m.push(k,trc(k)); m.push(none); return m;
  }
  const M=MODES[mode], st=['step',['to-number',['get',M.prop],-1],none];

}
function dimCond(){
  if(!dim.size) return null;

  if(dc) op=['case',dc,0.07,op]; if(focus) op=['case',hit,op,0.07];

function hitAt(pt){
  const b=[[pt.x-6,pt.y-6],[pt.x+6,pt.y+6]];
  const nl=['notes-pt','notes-line','notes-fill'].filter(l=>map.getLayer(l));
  if(layers.notes){ const n=map.queryRenderedFeatures(b,{layers:nl}); if(n.length){ const nt=notes.find(x=>x.id===n[0].properties.id); if(nt) return {note:nt}; } }
  const ly=[]; for(const p of visibleProjects()){ ly.push('poly-'+p.id,'lines-'+p.id); }
  if(layers.drain&&tool!=='prop'){ const dl=[]; for(const p of visibleProjects()) dl.push('drainR-'+p.id,'drainP-'+p.id);
    const d=map.queryRenderedFeatures([[pt.x-6,pt.y-6],[pt.x+6,pt.y+6]],{layers:dl.filter(l=>map.getLayer(l))});
    if(d.length){ const pr=d[0].properties, dp=getP(pr.pid); if(dp) return {drain:{p:dp,t:pr.t,r0:+pr.r0,r1:+pr.r1}}; } }
  const f=map.queryRenderedFeatures(b,{layers:ly.filter(l=>map.getLayer(l))});
  if(!f.length) return null;
  const pr=f[0].properties, p=getP(pr.pid); if(!p) return null;
  let row=+pr.row;
  if(pr.r0!==undefined){ const ll=map.unproject(pt); let bd=1e18; for(let t=+pr.r0;t<=+pr.r1;t++){ const d=(p.rows[t][1]-ll.lat)**2+(p.rows[t][2]-ll.lng)**2; if(d<bd){bd=d;row=t;} } }
  return {p,row,lane:+pr.lane};
}
function tipHtml(h){
  if(h.drain){ const {p,t,r0,r1}=h.drain; return `<b>Dreno tipo ${esc(t)}</b> <span>· ${(r1-r0+1)*20} m · lado ${p.opts.drainSide==='in'?'interno':'externo'}</span><br>km ${p.lab[r0]} a ${kmLabel(p.lnum[r1]+0.02)}${P.length>1?' · '+esc(projName(p)):''}`; }
  const {p,row,lane}=h, r=p.rows[row], L=lane?r[8][lane-1]:null;

  return `<b>km ${p.lab[row]}</b> <span>· ${lane?'Faixa '+lane:'Acostamento'}${P.length>1?' · '+esc(projName(p)):''}</span><br>${esc(l2)}`;
}

function select(pid,row,lane,opt={}){
  const p=getP(pid); if(!p) return;
  sel={pid,row,lane}; activeGroup=p.meta.uf; settingsPid=pid;
  updateSelLayer(); renderSeg(); if(opt.tab) setTab('seg');
  if(opt.pan&&mapReady){ const r=p.rows[row]; if(!map.getBounds().contains([r[2],r[1]])) map.easeTo({center:[r[2],r[1]],duration:500}); }
  renderGroups(); drawUni();
}
function updateSelLayer(){
  if(!mapReady) return;
  const fs=[];
  if(sel){
    const p=getP(sel.pid), f=p&&p.polyByFid.get(sel.row*8+(sel.lane?sel.lane:7));
    if(f){
      const c=f.geometry.coordinates[0], mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
      fs.push({type:'Feature',properties:{kind:'poly'},geometry:f.geometry});
      fs.push({type:'Feature',properties:{kind:'line',k:sel.lane?sel.lane-1:p.model[sel.row].w.length},geometry:{type:'LineString',coordinates:[mid(c[0],c[1]),mid(c[3],c[2])]}});
    }
  }
  map.getSource('sel').setData({type:'FeatureCollection',features:fs});
}
function stepSel(dr,dl){
  if(!sel) return; const p=getP(sel.pid), N=p.model[sel.row].w.length;
  const row=Math.max(0,Math.min(p.rows.length-1,sel.row+dr)), N2=p.model[row].w.length;
  let li=(sel.lane===0?N:sel.lane-1)+dl; li=Math.max(0,Math.min(N2,li));
  select(sel.pid,row,li>=N2?0:li+1,{pan:true});
}
function groupProjects(){ const v=visibleProjects(); if(!v.length) return []; if(!activeGroup||!v.some(p=>p.meta.uf===activeGroup)) activeGroup=v[0].meta.uf; return v.filter(p=>p.meta.uf===activeGroup).sort((a,b)=>b.meta.travel-a.meta.travel||a.meta.name.localeCompare(b.meta.name)); }
function goLabel(text){
  const m=/^(\d+)\+(\d{1,3})$/.exec(text.trim().replace(',','.')); let t;
  if(m) t=+m[1]+ +m[2].padEnd(3,'0')/1000; else { t=parseFloat(text.trim().replace(',','.')); if(isNaN(t)){ toast('Use o formato 59+740 ou 59,74'); return; } }
  let best=null; for(const p of groupProjects()){ for(let i=0;i<p.rows.length;i++){ const d=Math.abs(p.lnum[i]-t); if(!best||d<best.d) best={p,i,d}; } }
  if(!best||best.d>0.5){ toast('Esse km está fora dos trechos visíveis'); return; }
  const r=best.p.rows[best.i]; map.flyTo({center:[r[2],r[1]],zoom:Math.max(map.getZoom(),17.2),duration:900});
  select(best.p.id,best.i,1,{tab:true});
}
function setTab(t){

  ['resumo','seg','ana','notas','aj'].forEach(x=>$('#t-'+x).hidden=x!==t); syncSeg($('#tabs'));

function criticals(){
  const key=MODES[mode]?mode:'iri', M=MODES[key], arr=[];
  for(const p of visibleProjects()) p.rows.forEach((r,i)=>r[8].forEach((L,k)=>{ const v=L[M.i]; if(v!=null) arr.push({p,i,lane:k+1,v,km:r[0]}); }));
  arr.sort((a,b)=>M.low?a.v-b.v:b.v-a.v);
  const out=[]; for(const a of arr){ if(out.every(o=>o.p!==a.p||Math.abs(o.km-a.km)>0.2)) out.push(a); if(out.length>=5) break; }

    if(e.pname!==rec.pname||e.lane!==rec.lane||e.r1<rec.r0||e.r0>rec.r1){ out.push(e); continue; }
    idbDelP(e.id);
    if(e.r0<rec.r0){ const l={...e,id:e.id+'a',r1:rec.r0-1}; out.push(l); idbPutP(l); }
    if(e.r1>rec.r1){ const r={...e,id:e.id+'b',r0:rec.r1+1}; out.push(r); idbPutP(r); }

function onMapClick(e){
  if(tool==='pin'){ const c=[+e.lngLat.lng.toFixed(7),+e.lngLat.lat.toFixed(7)]; setTool(null); startNote('pin',[c]); return; }
  if(tool==='prop'){ const h=hitAt(e.point); if(h&&h.p&&!h.note&&!h.drain) propToggle(h.p,h.row,h.lane); return; }
  const h=hitAt(e.point); if(!h) return;
  if(h.note){ openNote(h.note.id); return; }
  if(h.drain){ const d=h.drain; select(d.p.id,Math.round((d.r0+d.r1)/2),1,{tab:true}); return; }
  select(h.p.id,h.row,h.lane,{tab:true});
}

/* ================================================================== */
/* Leitura de planilhas (padrões de arquivo)                           */
/* ================================================================== */
/* Para suportar outro padrão, adicione um item em FORMATS com detect(wb) e parse(wb). */
const FORMATS=[{id:'roadrunner',label:'RoadRunner',
  detect:wb=>wb.SheetNames.includes('Unifilar')&&wb.SheetNames.includes('Solução'),
  parse:wb=>{
    const rd=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    const solRows=rd('Solução'), U=rd('Unifilar').filter((r,i)=>i>=10&&typeof r[13]==='number');
    const S=solRows.filter((r,i)=>i>=9&&typeof r[2]==='number'), sol=new Map(S.map(r=>[Math.round(r[2]*1000),r]));
    const num=(v,n=2)=>typeof v==='number'?+v.toFixed(n):null, str=v=>typeof v==='string'&&v!==''?v:null;
    const rows=U.map(r=>{
      const sr=sol.get(Math.round(r[13]*1000)), widths=[0,1,2,3,4,5].map(i=>r[176+i]||0), nl=widths.filter(w=>w>0).length, lanes=[];
      for(let n=0;n<nl;n++){
        const b=21+17*n,t=30+17*n,treat=[]; for(let j=0;j<7;j++){ const v=r[t+j]; treat.push(typeof v==='string'?(v===''?0:v):(v==null||v===0?0:v)); }
        let esp=null,pct=null; if(sr) for(const [ce,cp] of [[55,62],[69,76]]) if(typeof sr[ce+n]==='number'&&sr[ce+n]){ esp=sr[ce+n]; pct=sr[cp+n]; }
        lanes.push([sr?str(sr[7+n]):null,num(r[b]),num(r[b+1],3),num(r[b+2]),num(r[b+6]),num(r[b+7],0),num(r[b+8]),str(r[b+3]),str(r[b+4]),num(r[b+5],1),treat,
          (r[152+n]==='C'||r[152+n]==='D')?r[152+n]:null,esp,pct,(sr&&typeof sr[118+n]==='number'&&sr[118+n])?num(sr[118+n]):null]);
      }
      let dr=null; if(sr){ const f=(a,b)=>str(b)||((a!==null&&a!==''&&a!==undefined)?'?':null); dr=[f(sr[15],sr[18]),f(sr[16],sr[19])]; if(dr[0]===null&&dr[1]===null) dr=null; }
      return [r[13],+r[15].toFixed(7),+r[16].toFixed(7),widths.slice(0,nl),r[182]||0,sr?str(sr[13]):null,str(r[19]),sr?str(sr[21]):null,lanes,str(r[14]),dr,[num(r[186],0),num(r[187],0)]];
    });
    if(!rows.length) throw new Error('nenhuma linha com hodômetro na aba Unifilar');
    const name=(solRows[1]&&solRows[1][2])||'Projeto', parts=name.split(' - ').map(s=>s.trim());
    return {meta:{name,uf:parts[0],via:parts.slice(1).join(' - '),travel:/Decrescente/.test(name)?-1:1,kmi:solRows[2]&&solRows[2][2],kmf:solRows[3]&&solRows[3][2],format:'roadrunner'},rows};
  }}];
function addProjectData(d,{silent}={}){
  const old=P.find(p=>p.meta.name===d.meta.name); if(old){ removeProjectFromMap(old); P=P.filter(x=>x!==old); }
  const p=createProject(d); P.push(p); resolveProps(); if(mapReady) addProjectToMap(p); return p;
}
$('#btnFile').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  const added=[];
  for(const f of files){
    toast(`Lendo ${f.name}... arquivos grandes podem levar alguns segundos`,60000);
    await new Promise(r=>setTimeout(r,30));
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array',sheets:['Unifilar','Solução'],dense:true,cellFormula:false,cellStyles:false,cellNF:false,cellHTML:false,cellText:false});
      const fm=FORMATS.find(x=>x.detect(wb)); if(!fm) throw new Error('formato não reconhecido. Padrões disponíveis: '+FORMATS.map(x=>x.label).join(', '));
      added.push(addProjectData(fm.parse(wb)));
    }catch(err){ toast(`${f.name}: ${err.message}`,6000); }
  }
  if(added.length){ renderAll(); fitList(added); toast(`${added.length} planilha(s) carregada(s)`); }
});

function setMode(m,silent){
  mode=m; dim.clear(); document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===m)); syncSeg($('#modes'));
  applyPaint(); renderResumo(); renderSeg(); if(!silent) renderAna();
}
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{ setMode(b.dataset.m); }));
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
$('#collapse').addEventListener('click',()=>{ const c=$('#inspector').classList.toggle('collapsed'); $('#collapse').innerHTML=c?IC.down:IC.up; $('#collapse').setAttribute('aria-label',c?'Expandir painel':'Recolher painel'); });
$('#goBtn').addEventListener('click',()=>{ const v=$('#gokm').value; if(v.trim()) goLabel(v); });
$('#gokm').addEventListener('keydown',e=>{ if(e.key==='Enter'){ $('#goBtn').click(); e.target.blur(); } });
addEventListener('keydown',e=>{
  const t=e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k>='1'&&k<='6'){ setMode(MODE_KEYS[+k-1]); return; }
  if(k==='/'){ e.preventDefault(); $('#gokm').focus(); return; }
  if(k==='Escape'){ if(tool){ setTool(null); return; } if(editing){ editing=null; refreshNotesLayer(); renderNotes(); return; } if(focus){ clearFocus(); return; } sel=null; updateSelLayer(); renderSeg(); drawUni(); return; }
  const lk=k.toLowerCase();
  if(lk==='p'){ setTool('pin'); return; } if(lk==='n'){ setTool('prop'); return; }
  if(lk==='q'){ map.easeTo({bearing:map.getBearing()-15,duration:250}); return; } if(lk==='e'){ map.easeTo({bearing:map.getBearing()+15,duration:250}); return; } if(lk==='r'){ alignToRoad(); return; }
  if(lk==='g'){ gpsToggle(); return; } if(lk==='s'){ setField(!field); return; }
  if(!sel) return; const big=e.shiftKey?10:1;
  if(k==='ArrowRight'){ e.preventDefault(); stepSel(big,0); } else if(k==='ArrowLeft'){ e.preventDefault(); stepSel(-big,0); }
  else if(k==='ArrowUp'){ e.preventDefault(); stepSel(0,-1); } else if(k==='ArrowDown'){ e.preventDefault(); stepSel(0,1); }
});

function alignToRoad(){
  if(!mapReady) return; let p,i;
  if(sel&&getP(sel.pid)){ p=getP(sel.pid); i=sel.row; } else { const c=map.getCenter(), l=locate(c.lat,c.lng); if(!l){ toast('Nenhum trecho visível'); return; } p=l.p; i=l.i; }
  const R=p.rows, a=Math.max(0,i-2), b=Math.min(R.length-1,i+2); if(a===b) return;
  const mLon=111320*Math.cos(R[i][1]*Math.PI/180);
  let br=Math.atan2((R[b][2]-R[a][2])*mLon,(R[b][1]-R[a][1])*M_LAT)*180/Math.PI;
  if(p.opts.travel<0) br+=180;
  map.easeTo({bearing:br,duration:600}); toast('Pista alinhada ao sentido de tráfego');
}
$('#rotL').addEventListener('click',()=>map.easeTo({bearing:map.getBearing()-15,duration:250}));
$('#rotR').addEventListener('click',()=>map.easeTo({bearing:map.getBearing()+15,duration:250}));
$('#rotN').addEventListener('click',()=>map.easeTo({bearing:0,duration:400}));

async function gunzipB64(b64){
  const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
async function boot(){
  try{ field = localStorage.getItem('rr-field')==='1'; }catch(e){}
  if(field){ document.documentElement.setAttribute('data-contrast','field'); $('#btnField').setAttribute('aria-pressed',true); }
  idb=await idbOpen(); notes=await idbAll(); props=await idbAllP();
  renderAll(); initMap();
  for(const key of ['mg_c','mg_d','mg_ms','go_c','go_d']){
    try{ const d=await gunzipB64(EMBED[key]); addProjectData(d); }catch(err){ toast('Falha ao abrir dados de exemplo: '+err.message,6000); }
  }
  resolveProps(); refreshPropLayers();
  activeGroup='BR-900/MG'; settingsPid=(P[0]||{}).id;
  if(mapReady){ renderAll(); fitAll(true); applyPaint(); }
  syncAllSegs();
}
boot();
