<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PaveCAD · Mapa de Soluções de Restauração</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23007aff%27/%3E%3Cpath d=%27M4 12L7 4h2l3 8%27 stroke=%27white%27 fill=%27none%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="app">
  <div class="stage">
    <div id="map" aria-label="Mapa do projeto"></div>

    <div class="topbar">
      <div class="glass title"><b id="title">Projetos</b><span id="subtitle"></span></div>
      <div class="seg modes glass" id="modes" role="group" aria-label="Colorir por">
        <button data-m="sol" aria-pressed="true" title="Atalho: 1">Solução</button>
        <button data-m="iri" aria-pressed="false" title="Atalho: 2">IRI</button>
        <button data-m="atr" aria-pressed="false" title="Atalho: 3">ATR</button>
        <button data-m="d0" aria-pressed="false" title="Atalho: 4">D0</button>
        <button data-m="rc" aria-pressed="false" title="Atalho: 5">Rc</button>
        <button data-m="def" aria-pressed="false" title="Atalho: 6">Defeitos</button>
      </div>
      <div class="topright">
        <div class="seg glass" id="base" role="group" aria-label="Base do mapa">
          <button data-b="none" aria-pressed="true">Liso</button>
          <button data-b="osm" aria-pressed="false">Ruas</button>
          <button data-b="esri" aria-pressed="false">Satélite</button>
        </div>
        <input id="file" type="file" accept=".xlsx,.xlsm" multiple hidden>
        <button class="pillbtn" id="btnExample" type="button" hidden title="Só em desenvolvimento: lê referencia/dados">Carregar exemplo</button>
        <button class="pillbtn primary" id="btnFile" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Planilhas</button>
      </div>
    </div>

    <div class="glass toolbar" id="toolbar" role="toolbar" aria-label="Ferramentas">
      <button class="tbtn" data-tool="pin" aria-pressed="false" title="Nota em um ponto (P)" aria-label="Nota em um ponto"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg></button>
      <button class="tbtn" data-tool="prop" aria-pressed="false" title="Propor nova solução (N)" aria-label="Propor nova solução"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnGps" aria-pressed="false" title="Minha posição (G)" aria-label="Minha posição"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="dot"></span></button>
      <button class="tbtn" id="btnField" aria-pressed="false" title="Modo campo para uso ao sol (S)" aria-label="Modo campo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>

    <div class="leftcol">
      <div class="glass search">
        <svg class="i" viewBox="0 0 24 24" style="color:var(--faint)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="gokm" class="num" placeholder="Ir para km" inputmode="decimal" aria-label="Ir para km">
        <button class="go" id="goBtn" type="button" aria-label="Ir"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="views" id="views"></div>
      <div id="zoomhost"></div>
      <div class="glass rotbar" id="rotbar" role="group" aria-label="Girar o mapa">
        <button class="tbtn" id="rotL" aria-label="Girar 15 graus à esquerda" title="Girar à esquerda (Q)"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
        <button class="tbtn" id="rotN" aria-label="Norte para cima" title="Norte para cima"><span id="compass" style="display:grid;transition:transform .15s"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l4.5 9h-9z" fill="#ff3b30" stroke="#ff3b30"/><path d="M12 21l-4.5-9h9z"/></svg></span></button>
        <button class="tbtn" id="rotR" aria-label="Girar 15 graus à direita" title="Girar à direita (E)"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/></svg></button>
        <button class="chipbtn" id="rotA" title="Pista na vertical, no sentido de tráfego (R)" style="border:0;background:var(--fill)">Alinhar à pista</button>
      </div>
      <p class="zoomnote" id="zoomnote"></p>
    </div>

    <div class="glass propbar" id="propbar" hidden></div>
    <div class="glass gpschip" id="gpschip" hidden></div>
    <div class="glass toast" id="toast" role="status" aria-live="polite"></div>
    <div class="glass tip" id="tip"></div>
  </div>
  <div class="glass legend" id="legend"></div>

  <aside class="glass inspector" id="inspector">
    <div class="ihead">
      <div class="seg lg" id="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-t="resumo">Resumo</button>
        <button role="tab" aria-selected="false" data-t="seg">Segmento</button>
        <button role="tab" aria-selected="false" data-t="ana">Análise</button>
        <button role="tab" aria-selected="false" data-t="notas">Revisão</button>
        <button role="tab" aria-selected="false" data-t="aj">Ajustes</button>
      </div>
      <button class="iconbtn" id="collapse" aria-label="Recolher painel" title="Recolher painel"><svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    </div>
    <div class="tabbody" id="t-resumo"></div>
    <div class="tabbody" id="t-seg" hidden></div>
    <div class="tabbody" id="t-ana" hidden></div>
    <div class="tabbody" id="t-notas" hidden></div>
    <div class="tabbody" id="t-aj" hidden></div>
    <div class="foot"><span><kbd>←</kbd> <kbd>→</kbd> segmento</span><span><kbd>↑</kbd> <kbd>↓</kbd> faixa</span><span><kbd>1</kbd> a <kbd>6</kbd> cor</span><span><kbd>/</kbd> km</span><span><kbd>P</kbd> nota</span><span><kbd>N</kbd> propor</span><span><kbd>Q</kbd> <kbd>E</kbd> <kbd>R</kbd> girar</span><span><kbd>G</kbd> GPS</span><span><kbd>S</kbd> campo</span><span><kbd>Esc</kbd> limpar</span></div>
  </aside>

  <section class="glass uni" id="unicard" aria-label="Unifilar">
    <div class="uni-h"><b>Unifilar</b><span class="chips" id="unigroups"></span><span class="sub" id="unisub"></span>
      <button class="iconbtn" id="uniToggle" aria-label="Recolher unifilar" title="Recolher unifilar" style="width:26px;height:26px"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div class="uni-wrap" id="uniwrap"><canvas id="uni"></canvas><div id="unihover"><span></span></div></div>
  </section>
</div>
<input id="photoIn" type="file" accept="image/*" capture="environment" hidden>
<input id="importIn" type="file" accept=".geojson,.json,application/json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
